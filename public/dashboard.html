<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mining Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    /* Old Styles (retained as requested) */
    
    #map {
      width: 100%;
      height: 200px;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    .life-table {
      width: 100%;
      border-collapse: collapse;
      color: white;
    }

    .life-table th, .life-table td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    :root {
      --bg: #0f1b2b;
      --panel: #17263c;
      --ink: #e6eef8;
      --muted: #a8b3c6;
      --track: #24364f;
      --ok: #1abc9c;
      --warn: #e67e22;
      --bad: #e74c3c;
      --blue: #3aa0ff;
      --purple: #9b59b6;
      --teal: #09faca;
      --yellow: #ffb300;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial;
    }

    header {
      padding: 18px 22px;
      border-bottom: 2px solid var(--yellow);
      font-weight: 700;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header .sub {
      color: var(--muted);
      font-weight: 500;
    }

    header .right {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }

    .wrap {
      padding: 18px;
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(12, 1fr);
    }

    .col-6 {
      grid-column: span 6;
    }

    .col-4 {
      grid-column: span 4;
    }

    .col-3 {
      grid-column: span 3;
    }

    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 0 0 1px #0b1626 inset, 0 6px 20px rgba(0, 0, 0, .25);
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 15px;
      letter-spacing: .4px;
      color: #fff;
    }

    .metric-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #122136;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .metric-main {
      flex: 1;
    }

    .title {
      font-size: 12px;
      color: var(--muted);
    }

    .value {
      font-size: 20px;
      font-weight: 700;
      margin-top: 2px;
    }

    .unit {
      opacity: .9;
      font-weight: 600;
    }

    .line {
      height: 3px;
      background: var(--track);
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }

    .line > span {
      display: block;
      height: 100%;
      width: 0;
    }

    .c-green .line > span {
      background: var(--ok);
    }

    .c-orange .line > span {
      background: var(--warn);
    }

    .c-red .line > span {
      background: var(--bad);
    }

    .c-blue .line > span {
      background: var(--blue);
    }

    .c-purple .line > span {
      background: var(--purple);
    }

    .c-teal .line > span {
      background: var(--teal);
    }

    .c-yellow .line > span {
      background: var(--yellow);
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 16px;
      margin-top: 6px;
    }

    .pill.ok {
      background: rgba(26, 188, 156, .18);
      color: var(--ok);
      box-shadow: 0 0 0 1px rgba(26, 188, 156, .25) inset;
    }

    .pill.warn {
      background: rgba(230, 126, 34, .18);
      color: var(--warn);
      box-shadow: 0 0 0 1px rgba(230, 126, 34, .25) inset;
    }

    .pill.bad {
      background: rgba(231, 76, 60, .18);
      color: var(--bad);
      box-shadow: 0 0 0 1px rgba(231, 76, 60, .25) inset;
    }

    .donut {
      --size: 60px;
      --thick: 9px;
      --p: 0;
      --col: var(--ok);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: conic-gradient(var(--col) calc(var(--p) * 1%), var(--track) 0);
      position: relative;
      display: grid;
      place-items: center;
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: calc(var(--thick) + 2px);
      background: var(--panel);
      border-radius: 50%;
    }

    .donut .icon {
      position: relative;
      width: 26px;
      height: 26px;
      opacity: .95;
      fill: var(--ink);
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .detail-box {
      background: #0f1e31;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      color: #cfe0f7;
      border: 1px solid #0c1728;
      white-space: pre-wrap;
    }

    .chart-wrap {
      background: #0f1e31;
      border: 1px solid #0c1728;
      border-radius: 10px;
      padding: 10px;
      height: 220px;
      display: flex;
      flex-direction: column;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .chart-head .t {
      font-size: 12px;
      color: var(--muted);
    }

    .chart-head .v {
      font-size: 18px;
      font-weight: 700;
    }

    canvas#vibrationChart {
      width: 100%;
      height: 160px;
      display: block;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr !important;
        gap: 12px;
      }

      .col-6,
      .col-4,
      .col-3 {
        grid-column: span 1 !important;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 14px;
      }

      .wrap {
        padding: 10px;
      }

      .panel {
        padding: 10px;
        border-radius: 8px;
      }

      .panel h3 {
        font-size: 14px;
        margin-bottom: 8px;
      }

      .metric-row {
        padding: 8px;
        gap: 8px;
      }

      .value {
        font-size: 16px;
      }

      .title {
        font-size: 11px;
      }

      .donut {
        --size: 48px;
        --thick: 8px;
      }

      .donut .icon {
        width: 20px;
        height: 20px;
      }

      .chart-wrap {
        height: 180px;
        padding: 8px;
      }

      canvas#vibrationChart {
        height: 120px;
      }
    }

    /* New Styles (retained and fixed) */
    body {
      background: #000000;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #ffffff;
    }

    h1 {
      text-align: center;
      color: #ffffff;
      padding: 20px 0;
      font-size: 30px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .panel-title {
      font-weight: bold;
      display: flex;
      background-color: #333333;
      color: #ffffff;
      cursor: pointer;
      font-size: 18px;
      user-select: none;
      text-align: center;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      position: relative;
      overflow: hidden;
      width: 150px;
      height: 200px;
      border-radius: 12px;
      margin: 10px;
      padding: 8px;
      white-space: normal;
      word-break: break-word;
      line-height: 1.2;
    }

    .panel-title:hover {
      background-color: #921616;
    }

    .panel-content {
      display: none;
      padding: 20px;
    }

    .panel-button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .panel-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .panel-title img.panel-icon {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .panel-bg {
      width: 100%;
      height: 90%;
      object-fit: cover;
      flex-grow: 1;
      border-radius: 0 0 12px 12px;
      z-index: 1;
    }

    .panel-label {
      z-index: 2;
      color: #ffffff;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      padding: 8px;
      line-height: 1.2;
      width: 100%;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 10px;
    }

    .dashboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      box-sizing: border-box;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .bar-container {
      background: #333333;
      border-radius: 5px;
      overflow: hidden;
      height: 8px;
      margin-top: 6px;
    }

    .bar {
      height: 100%;
      background-color: #4d96ff;
      width: 68%;
    }
     .card {
      background-color: #1a1a1a;
      background: #1e1f23;
      border-radius: 12px;
      padding: 16px;
      color: #f0f4f9;

      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);

    .card2 {
      background-color: #1a1a1a;

      padding: 14px 16px;
      color: #f0f4f9;

    }

    h2 {
      text-align: left;
      color: #ffffff;

    }

    hr {
      border: 0;

    }
    .value {
      font-size: 1rem;

    }

    .sub-label {

    .big-value {

      margin: 0 0 10px;

    }

    .small {
      font-size: 14px;
      color: #cccccc;
    }

    .dashboard1 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;

    }

    .card1 {
      background-color: #1e1f23;
      border-radius: 16px;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .value-label {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }

    .progress-bar {
      height: 6px;
      border-radius: 4px;
      background-color: #133041;
      overflow: hidden;
    }

    .progress-bar div {
      height: 100%;
      background-color: #00cfff;
    }

    .circular {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100px;
      width: 100px;
      border-radius: 50%;
      background: conic-gradient(#00cfff 56%, #1b384c 0);
      font-size: 20px;
      font-weight: bold;
    }

    .tiny-chart canvas {
      width: 100% !important;
      height: 30px !important;
    }

    .bar-segments {
      display: flex;
      gap: 2px;
    }

    .bar-segments div {
      width: 8px;

    }

    canvas {
      max-width: 100%;
      height: 120px;
    }

    .sparkline-canvas {
      height: 60px !important;
    }
    /* In <style> section */
    #dashboard-title {
      text-align: center;
      color: #ffffff;
      padding: 20px 0;
      font-size: 30px;
      display: block; /* Default display */
    }
    #dashboard-title.hidden {
      display: none; /* Hide when graph view is active */
    }

    @media (max-width: 768px) {
      .dashboard1 {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }

    @media (min-width: 768px) {
      .dashboard1 {
        grid-template-columns: repeat(2, 1fr);

      .dashboard1 {

  </style>
</head>
<body>
  <h1 id="dashboard-title">Mining Sensor Dashboard</h1>

  <!-- Header with back button -->
  <!-- Header with back button -->
<div id="panel-header" style="display:none; align-items:center; gap:100px; padding:10px; background:transperant">
  <button onclick="goBack()">⬅ Back</button>
  <span id="panel-title" style="font-weight:bold; font-size:18px;"></span>
</div>

<!-- Panel list (first screen) -->
<div id="all-panels" class="panel-grid">

  <div id="tile-overview" class="panel-title" onclick="togglePanel('view', 'Overview')">
    <div class="panel-label">Overview</div>
    <img src="images/overview1.jpg" alt="Overview" class="panel-bg">
  </div>

  <div id="tile-fuel" class="panel-title" onclick="togglePanel('Fuel', 'Mine Planner')">
    <div class="panel-label">Mine Planner</div>
    <img src="images/fm.jpg" alt="Mine Planner" class="panel-bg">
  </div>

  <div id="tile-env" class="panel-title" onclick="togglePanel('env', 'ENV Monitoring')">
    <div class="panel-label">ENV Monitoring</div>
    <img src="images/env.png" alt="ENV Monitoring" class="panel-bg">
  </div>

  <div id="tile-machinery" class="panel-title" onclick="togglePanel('machinery', 'Machinery Analysis')">
    <div class="panel-label">Machinery Analysis</div>
    <img src="images/ma2.jpeg" alt="Machinery Analysis" class="panel-bg">
  </div>

  <div id="tile-worker" class="panel-title" onclick="togglePanel('worker', 'Worker Safety')">
    <div class="panel-label">Worker Safety</div>
    <img src="images/worker safety.jpg" alt="Worker Safety" class="panel-bg">
  </div>

  <div id="tile-prediction" class="panel-title" onclick="togglePanel('prediction', 'Prediction Dashboard')">
    <div class="panel-label">Prediction Dashboard</div>
    <img src="images/pd2.jpg" alt="Prediction Dashboard" class="panel-bg">
  </div>

  <div id="tile-cm" class="panel-title" onclick="togglePanel('Continuous_minier', 'Continuous Miner')">
    <div class="panel-label">Continuous Miner</div>
    <img src="images/cm2.jpg" alt="Continuous Miner" class="panel-bg">
  </div>

  <div id="tile-ram" class="panel-title" onclick="togglePanel('Ram_car', 'Ram Car')">
    <div class="panel-label">Ram Car</div>
    <img src="images/ram.jpg" alt="Ram Car" class="panel-bg">
  </div>
  <div id="tile-sail" class="panel-title" onclick="togglePanel('Manufacturing', 'Manufacturing')">
    <div class="panel-label">Manufacturing</div>
    <img src="images/ma.jpg" alt="Manufacturing" class="panel-bg">
  </div>

  <div id="tile-drone" class="panel-title" onclick="togglePanel('DroneStream', 'Drone Live Stream')">
    <div class="panel-label">Drone Stream</div>
    <img src="images/drone-setup.jpg" alt="Drone Stream" class="panel-bg">
    </div>
  </div>



  <!-- Hidden panel containers -->
  <div id="view" class="panel-content"></div>
  <div id="Fuel" class="panel-content"></div>
  <div id="env" class="panel-content"></div>
  <div id="machinery" class="panel-content"></div>
  <div id="worker" class="panel-content"></div>
  <div id="prediction" class="panel-content"></div>
  <div id="Continuous_minier" class="panel-content"></div>
  <div id="Ram_car" class="panel-content"></div>
  <div id="Manufacturing" class="panel-content"></div>
  <div id="DroneStream" class="panel-content">
</div>

  <script>
  const params = new URLSearchParams(window.location.search);
  const sector    = params.get('sector')    || '';
  const company   = (params.get('company')  || '').trim();  // e.g. "SAIL"
  let   region    = (params.get('region')   || '').trim();  // e.g. "Bhilai"
  const device_id = params.get('device_id') || '';

const API_URL = `http://104.154.141.198:5003/fetch-dashboard-data?company=${encodeURIComponent(company)}&sector=${encodeURIComponent(sector)}&region=${encodeURIComponent(region)}&device_id=${encodeURIComponent(device_id)}`;

let cachedData = null;

document.addEventListener("DOMContentLoaded", () => {

  // ---------- 1️⃣  KACHE RULE ----------
  if (region === "Kache" || region === "Demo_Region") {
    showOnly(["tile-fuel"]);      // show Fuel only
    return;
  }
  // ---------- 2️⃣  BHILAI ----------
  if (region === "Bhilai") {
    showOnly(["tile-sail"]);      // show Manufacturing only
    return;
  }
  // ---------- 2️⃣  DRONE SETUP ----------
  if (region === "Drone survey") {
    showOnly(["tile-drone"]);

    // Set the stream URL into your iframe/video element
    
    return;
  }
    // ---------- 3️⃣  ALL OTHER REGIONS ----------
  // show everything except Fuel and Manufacturing
  document.querySelectorAll("#all-panels .panel-title").forEach(el => {
    if (el.id === "tile-fuel" || el.id === "tile-sail" || el.id ==="tile-drone") {
      el.style.display = "none";  // hide Fuel & Manufacturing
    } else {
      el.style.display = "block";
    }
  });
});

    // ---------- Helper: hide all tiles except those in allowedIds ----------
function showOnly(allowedIds) {
  document.querySelectorAll("#all-panels .panel-title").forEach(el => {
    el.style.display = allowedIds.includes(el.id) ? "block" : "none";
  });
}
// Dummy functions so example runs without errors:
function togglePanel(id, title) {
  alert("Open panel: " + title);
}
function goBack() {
  alert("Back button clicked");
}
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const fmt = (n, dec = 0) => (n == null || isNaN(n)) ? '-' : Number(n).toFixed(dec);
  const statusClass = (txt = '') => {
    const v = (txt || '').toString().toLowerCase();
    if (v.includes('fault') || v.includes('fail') || v.includes('hife')) return 'bad';
    if (v.includes('warn') || v.includes('alert')) return 'warn';
    return 'ok';
  };

  const redIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    shadowSize: [41, 41]
  });

  const blueIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    shadowSize: [41, 41]
  });

  function lineRow({ title, value, unit = '', percent = 0, colorClass = 'c-green' }) {
    return `
      <div class="metric-row ${colorClass}">
        <div class="metric-main">
          <div class="title">${title}</div>
          <div class="value">${fmt(value, (unit === 'psi' || unit === 'kW' || unit === 'h' || unit === '°F' || unit === 'V') ? 0 : 0)} <span class="unit">${unit}</span></div>
          <div class="line"><span style="width:${clamp(percent, 0, 100)}%"></span></div>
        </div>
      </div>
    `;
  }

  function batteryRow({ title, value, percent, color = '#1abc9c', colorClass = 'c-green' }) {
    return `
      <div class="metric-row ${colorClass}">
        <div class="donut" style="--p:${clamp(percent, 0, 100)}; --col:${color}">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 8a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v1h1.2a.8.8 0 0 1 .8.8v4.4a.8.8 0 0 1-.8.8H19v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8zm3 1v6h10V9H5z"/>
          </svg>
        </div>
        <div class="metric-main">
          <div class="title">${title}</div>
          <div class="value">${fmt(value, 0)}<span class="unit">%</span></div>
          <div class="line"><span style="width:${clamp(percent, 0, 100)}%"></span></div>
        </div>
      </div>
    `;
  }

  function pillRow(title, text) {
    const cls = statusClass(text);
    return `
      <div class="metric-row">
        <div class="metric-main">
          <div class="title">${title}</div>
          <div class="pill ${cls}">${text ?? '-'}</div>
        </div>
      </div>
    `;
  }

  function detailsBox(title, text) {
    return `
      <div class="metric-row">

  function drawVibrationChart(canvas, points, labels, lineColor = '#1abc9c') {
    if (!canvas) return;

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const cssW = canvas.clientWidth || 300;
    const cssH = canvas.clientHeight || 160;
    canvas.width = Math.max(1, Math.floor(cssW * dpr));
    canvas.height = Math.max(1, Math.floor(cssH * dpr));

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    const pad = { t: 10, r: 8, b: 28, l: 32 };
    const W = cssW - pad.l - pad.r;
    const H = cssH - pad.t - pad.b;

    if (!points || points.length < 2 || W <= 0 || H <= 0) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted') || '#a8b3c6';
      ctx.font = '12px system-ui';
      ctx.fillText('Not enough data for chart', 10, 16);
      return;
    }

    const min = Math.min(...points);
    const max = Math.max(...points);
    const range = (max - min) || 1;
    const yMin = Math.floor(min - range * 0.1);
    const yMax = Math.ceil(max + range * 0.1);

    const axis = getComputedStyle(document.documentElement).getPropertyValue('--track') || '#24364f';
    const gridCol = 'rgba(255,255,255,0.06)';
    const textCol = getComputedStyle(document.documentElement).getPropertyValue('--muted') || '#a8b3c6';

    ctx.strokeStyle = gridCol;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const y = pad.t + (H * (i / 3));
      ctx.beginPath();
      ctx.moveTo(pad.l, y);
      ctx.lineTo(pad.l + W, y);
      ctx.stroke();
    }

    ctx.strokeStyle = axis;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, pad.t + H);
    ctx.lineTo(pad.l + W, pad.t + H);
    ctx.stroke();

    ctx.fillStyle = textCol;
    ctx.font = '11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(yMax.toString(), pad.l - 6, pad.t + 10);
    ctx.fillText(yMin.toString(), pad.l - 6, pad.t + H);

    const nTicks = Math.min(5, labels.length);
    ctx.textAlign = 'center';
    ctx.font = '11px system-ui';
    ctx.fillStyle = textCol;

    for (let i = 0; i < nTicks; i++) {
      const idx = Math.round(i * (labels.length - 1) / (nTicks - 1 || 1));
      const x = pad.l + (W * (idx / (labels.length - 1)));
      const yAxis = pad.t + H;

      ctx.strokeStyle = axis;
      ctx.beginPath();
      ctx.moveTo(x, yAxis);
      ctx.lineTo(x, yAxis + 4);
      ctx.stroke();

      const lab = labels[idx] || '';
      ctx.fillText(lab, x, yAxis + 16);
    }

    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    points.forEach((v, i) => {
      const x = pad.l + (W * (i / (points.length - 1)));
      const y = pad.t + H - ((v - yMin) / (yMax - yMin)) * H;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.fillStyle = lineColor;
    points.forEach((v, i) => {
      const x = pad.l + (W * (i / (points.length - 1)));
      const y = pad.t + H - ((v - yMin) / (yMax - yMin)) * H;
      ctx.beginPath();
      ctx.arc(x, y, 2.8, 0, Math.PI * 2);
      ctx.fill();
    });
  }

const deviceDisplayNames = {
  'D3': '25',
  'D8': '97', 
  'D9': '12'
  // Keep other devices as-is
};

function getDisplayName(deviceId) {
  return deviceDisplayNames[deviceId] || deviceId;
}

function getDeviceIdFromDisplayName(displayName) {
  // Reverse lookup
  for (const [deviceId, name] of Object.entries(deviceDisplayNames)) {
    if (name === displayName) return deviceId;
  }
  return displayName; // If not found, return as-is
}
function getMovementFromPitch(pitch) {
  if (pitch === null || pitch === undefined || isNaN(pitch)) {
    return null;
  }

  if (pitch > 5) return 'UPHILL';
  if (pitch < -5) return 'DOWNHILL';
  return 'Flat'; // -5 to +5
}

function generateReportFromMapData() {
  if (!pathHistory || Object.keys(pathHistory).length === 0) {
    return { daily: [], weekly: [], monthly: [], summary: [] };
  }

  const daily = [];
  const weekly = [];
  const monthly = [];
  const summary = [];

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfToday);
  startOfWeek.setDate(startOfWeek.getDate() - 6);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  for (const id in pathHistory) {
    const segments = pathHistory[id];
    if (!segments || segments.length === 0) continue;

    const displayName = getDisplayName(id); // Get display name

    segments.forEach(p => {
      if (!p.timestamp) return;

      const ts = new Date(p.timestamp);

      const row = {
        Hauler: displayName, // Use display name
        Timestamp: ts.toLocaleString(),
        Lat: p.pos?.[0] ?? null,
        Lng: p.pos?.[1] ?? null,
        RL: p.rl ?? null,
        Altitude: p.altitude ?? null,
        Pitch: p.pitch ?? null,
        Roll: p.roll ?? null,
        Movement: getMovementFromPitch(p.pitch),
        Distance: p.distance ?? 0,
        'Fuel (L)': p.fuel ?? 0,
        'Fuel Cost (₹)': p.fuel_cost ?? 0,
      };

      if (ts >= startOfToday) {
        daily.push(row);
      }

      if (ts >= startOfWeek) {
        weekly.push(row);
      }

      if (ts >= startOfMonth) {
        monthly.push(row);
      }
    });

    const last = segments[segments.length - 1];
    if (last) {
      const totalFuel = segments.reduce((sum, p) => sum + (p.fuel || 0), 0);
      const totalFuelCost = segments.reduce((sum, p) => sum + (p.fuel_cost || 0), 0);
      const totalDistance = segments.reduce((sum, p) => sum + (p.distance || 0), 0);
      
      summary.push({
        'Vehicle ID': getDisplayName(id), // Use display name
        'Last Position': last.pos ? `${last.pos[0].toFixed(6)}, ${last.pos[1].toFixed(6)}` : 'N/A',
        RL: last.rl ?? null,
        Altitude: last.altitude ?? null,
        Payload: last.payload ?? 0,
        'Total Distance (km)': parseFloat(totalDistance.toFixed(4)),
        'Total Fuel (L)': parseFloat(totalFuel.toFixed(4)),
        'Total Fuel Cost (₹)': parseFloat(totalFuelCost.toFixed(2)),
        'Fuel Efficiency (L/km)': totalDistance > 0 ? parseFloat((totalFuel / totalDistance).toFixed(4)) : 'N/A',
        'Cost per km (₹/km)': totalDistance > 0 ? parseFloat((totalFuelCost / totalDistance).toFixed(2)) : 'N/A',
        'Data Points': segments.length,
        'Last Update': last.timestamp ? new Date(last.timestamp).toLocaleString() : 'N/A'
      });
    }
  }

  return { daily, weekly, monthly, summary };
}

function downloadReport(reportType = 'daily') {
  console.log(`Downloading ${reportType} report...`);
  
  // Debug log with display names
  for (const id in pathHistory) {
    if (pathHistory[id].length > 0) {
      console.log(`Data for ${getDisplayName(id)} (${id}):`, pathHistory[id].length, 'points');
      break;
    }
  }
  
  // Prevent double-click / recursion
  if (window.isDownloading) {
    console.warn('Download already in progress');
    return;
  }

  try {
    window.isDownloading = true;

    const reportData = generateReportFromMapData();
    if (!reportData.daily.length) {
      alert('No data available to generate report');
      return;
    }

    const wb = XLSX.utils.book_new();

    if (reportType === 'daily') {
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(reportData.daily),
        'Daily Report'
      );
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(reportData.weekly),
        'Weekly Report'
      );
    } else {
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(reportData.monthly),
        'Monthly Report'
      );
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(reportData.summary),
        'Summary'
      );
    }

    const fileName = `Mine_Haul_${reportType}_Report_${new Date()
      .toISOString()
      .split('T')[0]}.xlsx`;

    // ✅ Generate BOTH formats (safe & required)
    const base64Data = XLSX.write(wb, {
      bookType: 'xlsx',
      type: 'base64'
    });

    const wbBuffer = XLSX.write(wb, {
      bookType: 'xlsx',
      type: 'array'
    });

    // 📱 Flutter WebView download
    if (typeof window.flutterDownload === "function") {
      console.log('Using Flutter WebView download method');
      try {
        const ok = window.flutterDownload(
          base64Data,
          fileName,
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        );
        if (ok) {
          console.log('Flutter download initiated successfully');
          return;
        }
      } catch (flutterError) {
        console.error('Flutter download failed:', flutterError);
        // fallback continues
      }
    }

    // 🌐 Browser fallback download
    console.log('Using browser fallback download method');
    const blob = new Blob([wbBuffer], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      console.log('Download completed');
    }, 100);

  } catch (error) {
    console.error('Error downloading report:', error);
    alert(`Failed to download report: ${error.message}`);
  } finally {
    window.isDownloading = false;
  }
}

// Function to fetch 30-day data from the new URL
async function fetch30DayData() {
  try {
    const url = 'http://104.154.141.198:5003/fetch-all-devices-30d?company=TMC&sector=Mining&region=Kache';
    console.log(`Fetching 30-day data from: ${url}`);
    
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    console.log('30-day data received. Devices found:', Object.keys(data.data || {}));
    
    // Log device mapping info
    Object.keys(data.data || {}).forEach(deviceId => {
      const displayName = getDisplayName(deviceId);
      const deviceData = data.data[deviceId];
      if (deviceData && deviceData.length > 0) {
        console.log(`Device ${displayName} (${deviceId}): ${deviceData.length} data points`);
      }
    });
    
    return data;
  } catch (error) {
    console.error('Error fetching 30-day data:', error);
    return null;
  }
}

// Function to generate report from 30-day data
function generateReportFrom30DayData(monthlyData) {
  const monthly = [];
  const summary = [];

  if (!monthlyData || !monthlyData.data) {
    console.warn('No monthly data available');
    return { monthly: [], summary: [] };
  }

  // Process each device's 30-day data
  for (const deviceId in monthlyData.data) {
    const deviceData = monthlyData.data[deviceId];
    const displayName = getDisplayName(deviceId); // Get display name
    
    if (!deviceData || deviceData.length === 0) {
      console.log(`No data for device ${displayName} (${deviceId})`);
      continue;
    }
    
    console.log(`Processing ${deviceData.length} points for device ${displayName} (${deviceId})`);
    
    // Add all data points to monthly report
    deviceData.forEach((point, index) => {
      try {
        const ts = new Date(point.timestamp);
        
        const row = {
          'Vehicle ID': displayName, // Display name
          'Timestamp': ts.toLocaleString(),
          'Latitude': point.pos?.[0] ?? null,
          'Longitude': point.pos?.[1] ?? null,
          'RL': point.rl ?? null,
          'Altitude': point.altitude ?? null,
          'Pitch': point.pitch ?? null,
          'Roll': point.roll ?? null,
          'Movement': getMovementFromPitch(point.pitch),
          'Distance (km)': point.distance ?? 0,
          'Fuel (L)': point.fuel ?? 0,
          'Fuel Cost (₹)': point.fuel_cost ?? 0,
        };
        
        monthly.push(row);
      } catch (error) {
        console.error(`Error processing point ${index} for ${displayName}:`, error);
      }
    });
    
    // Create summary for this device
    if (deviceData.length > 0) {
      try {
        const lastPoint = deviceData[deviceData.length - 1];
        const totalFuel = lastPoint.cumulative_fuel || 0;
        const totalFuelCost = lastPoint.cumulative_fuel_cost || 0;
        const totalDistance = lastPoint.cumulative_distance || 0;
        
        // Calculate daily averages (assuming 30 days)
        const avgDailyDistance = (totalDistance / 30).toFixed(2);
        const avgDailyFuel = (totalFuel / 30).toFixed(2);
        const avgDailyCost = (totalFuelCost / 30).toFixed(2);
        
        summary.push({
          'Vehicle ID': displayName, // Display name
          
          'Data Points': deviceData.length,
          'Total Distance (30-day)': `${parseFloat(totalDistance.toFixed(2))} km`,
          'Total Fuel (30-day)': `${parseFloat(totalFuel.toFixed(2))} L`,
          'Total Fuel Cost (30-day)': `₹${parseFloat(totalFuelCost.toFixed(2))}`,
          'Avg Daily Distance': `${avgDailyDistance} km/day`,
          'Avg Daily Fuel': `${avgDailyFuel} L/day`,
          'Avg Daily Cost': `₹${avgDailyCost}/day`,
          'Fuel Efficiency': totalDistance > 0 ? 
            `${(totalFuel / totalDistance).toFixed(2)} L/km` : 'N/A',
          'Cost per km': totalDistance > 0 ? 
            `₹${(totalFuelCost / totalDistance).toFixed(2)}/km` : 'N/A',
          'Last Position': lastPoint.pos ? 
            `${lastPoint.pos[0].toFixed(6)}, ${lastPoint.pos[1].toFixed(6)}` : 'N/A',
          'Last Update': new Date(lastPoint.timestamp).toLocaleString()
        });
        
        console.log(`Summary for ${displayName}:`, {
          totalDistance,
          totalFuel,
          totalFuelCost
        });
      } catch (error) {
        console.error(`Error creating summary for ${displayName}:`, error);
      }
    }
  }

  console.log(`Generated ${monthly.length} monthly data rows and ${summary.length} summary rows`);
  return { 
    monthly: monthly, 
    summary: summary 
  };
}

// ==================== DEVICE NAME MAPPING FOR CHARTS ====================
const deviceDisplayNames = {
  'D3': '25',
  'D8': '97', 
  'D9': '12'
  // Keep other devices as-is
};

function getDisplayName(deviceId) {
  return deviceDisplayNames[deviceId] || deviceId;
}

function getDeviceIdFromDisplayName(displayName) {
  // Reverse lookup
  for (const [deviceId, name] of Object.entries(deviceDisplayNames)) {
    if (name === displayName) return deviceId;
  }
  return displayName; // If not found, return as-is
}

const fuelChartManager = {
  currentChart: null,
  chartIdCounter: 0,
  lastDataHash: {}, // Store last data hash for each hauler
  
  destroyCurrentChart: function() {
    if (this.currentChart) {
      try {
        this.currentChart.destroy();
      } catch (e) {
        console.log('Chart already destroyed or not found');
      }
      this.currentChart = null;
    }
  },
  
  createNewChart: function(canvasId, config) {
    this.destroyCurrentChart();
    
    // Forcefully remove any existing canvas with the same ID
    const existingCanvas = document.getElementById(canvasId);
    if (existingCanvas && existingCanvas.parentNode) {
      existingCanvas.parentNode.removeChild(existingCanvas);
    }
    
    // Create new unique canvas ID to avoid conflicts
    const uniqueCanvasId = `fuelGradientChart_${Date.now()}`;
    const chartContainer = document.getElementById('fuelChartContainer');
    
    // Clear container and add new canvas
    chartContainer.innerHTML = `<canvas id="${uniqueCanvasId}" height="180"></canvas>`;
    
    // Get context and create chart
    const ctx = document.getElementById(uniqueCanvasId).getContext('2d');
    this.currentChart = new Chart(ctx, config);
    
    return this.currentChart;
  },
  
  // Generate hash for fuel data to detect changes
  generateFuelDataHash: function(data, haulerId) {
    if (!data || !Array.isArray(data) || data.length === 0) return '';
    
    // Create hash from timestamps and z_axis values
    return data.map(row => `${row.timestamp}:${row.z_axis}`).join('|');
  },
  
  // Check if fuel data has changed
  hasFuelDataChanged: function(newData, haulerId) {
    const newHash = this.generateFuelDataHash(newData, haulerId);
    const oldHash = this.lastDataHash[haulerId] || '';
    
    if (newHash !== oldHash) {
      this.lastDataHash[haulerId] = newHash;
      return true;
    }
    return false;
  },
  
  // Clear hash for a specific hauler
  clearHash: function(haulerId) {
    delete this.lastDataHash[haulerId];
  }
};

// Function to render fuel gradient chart for selected hauler - OPTIMIZED VERSION
async function renderFuelGradientForHauler(haulerId, forceRefresh = false) {
  try {
    const chartContainer = document.getElementById('fuelChartContainer');
    const selectedHaulerFuelChart = document.getElementById('selectedHaulerFuelChart');
    const fuelChartHaulerName = document.getElementById('fuelChartHaulerName');
    
    if (!chartContainer || !selectedHaulerFuelChart) {
      console.error('Chart containers not found');
      return;
    }
    
    // Get display name for the hauler
    const displayName = getDisplayName(haulerId);
    
    // Show the chart container for ALL haulers INCLUDING D7
    selectedHaulerFuelChart.style.display = 'block';
    // Update the title to show "Excavator" for D7, "Hauler" for others
    fuelChartHaulerName.textContent = `${haulerId === 'D7' ? 'Excavator' : 'Hauler'}: ${displayName}`;
    
    // Fetch data from backend
    const response = await fetch('/api/get_last_10_zaxis');
    const haulerData = await response.json();
    
    const data = haulerData[haulerId];
    if (!data || !Array.isArray(data) || data.length === 0) {
      chartContainer.innerHTML = `<div style="color: #ccc; text-align: center; padding: 20px;">No fuel data available for ${displayName}</div>`;
      return;
    }
    
    // ALWAYS UPDATE CHART WHEN HAULER SELECTION CHANGES
    console.log(`🔄 Rendering chart for ${displayName} (${haulerId}) with available data`);
    
    // Show loading state briefly
    chartContainer.innerHTML = '<div style="color: #6ff3d6; text-align: center; padding: 20px;">Loading fuel data...</div>';
    
    // Small delay to show loading state
    await new Promise(resolve => setTimeout(resolve, 100));
    
    // Process data
    data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const limitedData = data.slice(0, 5);
    
    console.log('Latest data for', displayName, '(', haulerId, '):', limitedData);
    
    let zAxis = limitedData.map(row => Number(row.z_axis));
    let timestamps = limitedData.map(row => row.timestamp);
    
    if (zAxis.length === 0) {
      // Default data if no z_axis available
      zAxis = [-30, -25, -20, -15, -10];
      timestamps = new Array(5).fill(new Date().toISOString());
    }
    
    const baselineKmpl = haulerId === 'D7' ? 0.8 : 1.5; // Different baseline for excavator
    const FC0 = 100 * baselineKmpl;
    
    const gradients = zAxis.map(z => Math.sin(z * Math.PI / 180) * 100);
    const fuelConsumption = zAxis.map(z => FC0 * (1 + 0.1 * Math.sin(z * Math.PI / 180)));
    
    // Format timestamps
    const formattedLabels = timestamps.map(t => {
      try {
        const match = t.match(/T(\d{2}:\d{2}:\d{2})/);
        if (match) {
          return match[1];
        }
        
        const d = new Date(t);
        if (isNaN(d)) return t;
        
        const hours = d.getUTCHours().toString().padStart(2, '0');
        const minutes = d.getUTCMinutes().toString().padStart(2, '0');
        const seconds = d.getUTCSeconds().toString().padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
      } catch (err) {
        console.error('Error formatting timestamp:', t, err);
        return t;
      }
    });
    
    console.log('Formatted time labels:', formattedLabels);
    
    // Different colors for different vehicle types
    const getChartColors = (haulerId) => {
      switch(haulerId) {
        case 'D7': // Excavator - orange theme
          return {
            fuelColor: '#FF5722',
            gradientColor: '#FF9800'
          };
        case 'D3': // Hauler 25 (D3) - blue theme
          return {
            fuelColor: '#2196F3',
            gradientColor: '#64B5F6'
          };
        case 'D8': // Hauler 97 (D8) - green theme
          return {
            fuelColor: '#4CAF50',
            gradientColor: '#81C784'
          };
        case 'D9': // Hauler 12 (D9) - purple theme
          return {
            fuelColor: '#9C27B0',
            gradientColor: '#BA68C8'
          };
        default: // Other haulers - blue theme
          return {
            fuelColor: '#36a2eb',
            gradientColor: '#32cd32'
          };
      }
    };
    
    const colors = getChartColors(haulerId);
    
    const chartConfig = {
      type: 'line',
      data: {
        labels: formattedLabels,
        datasets: [
          {
            label: `Fuel - ${displayName}`,
            data: fuelConsumption,
            borderColor: colors.fuelColor,
            backgroundColor: colors.fuelColor + '20',
            tension: 0.3,
            fill: false,
            borderWidth: 2,
            pointRadius: 3
          },
          {
            label: `Gradient - ${displayName}`,
            data: gradients,
            borderColor: colors.gradientColor,
            backgroundColor: colors.gradientColor + '20',
            tension: 0.3,
            fill: false,
            borderWidth: 2,
            pointRadius: 3,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            position: 'top',
            labels: {
              color: '#ccc',
              font: { size: 10 },
              boxWidth: 12,
              padding: 10
            }
          },
          tooltip: {
            mode: 'index',
            intersect: false,
            backgroundColor: 'rgba(10, 25, 32, 0.9)',
            titleColor: '#6ff3d6',
            bodyColor: '#fff',
            borderColor: '#6ff3d6',
            borderWidth: 1,
            callbacks: {
              title: function(tooltipItems) {
                const index = tooltipItems[0].dataIndex;
                return timestamps[index];

    // Include all haulers with their display names
    const haulers = ['D3', 'D7', 'D8', 'D9', 'D12'];
    
    // Different baselines for different vehicle types

      if (haulerId === 'D7') return 0.8; // Excavator has different fuel efficiency

    };

      const displayName = getDisplayName(hauler);

        console.log(`No data for ${displayName} (${hauler})`);
        continue;
      }
      
      // Get LATEST 5 records
      data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      const limitedData = data.slice(0, 5);
      
      let zAxis = limitedData.map(row => Number(row.z_axis));
      let timestamps = limitedData.map(row => row.timestamp);
      
      if (zAxis.length === 0) continue;
      
      // Use first hauler's latest timestamps for x-axis
      if (allTimestamps.length === 0 && timestamps.length > 0) {
        allTimestamps = timestamps.map(t => {
          try {

            if (match) {
              return match[1];
            }
            
            const d = new Date(t);
            if (isNaN(d)) return t;
            
            const hours = d.getUTCHours().toString().padStart(2, '0');
            const minutes = d.getUTCMinutes().toString().padStart(2, '0');
            const seconds = d.getUTCSeconds().toString().padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
          } catch (err) {
            console.error('Error formatting timestamp:', t, err);
            return t;

function aggregateFuelDataByDate(haulerId) {
  const haulerHistory = pathHistory[haulerId];
  if (!haulerHistory || haulerHistory.length === 0) {
    console.log(`No history data for ${getDisplayName(haulerId)} (${haulerId})`);
    return null;
  }
  
  // Get data for the last 7 days
  const now = Date.now();
  const sevenDaysAgo = now - (7 * 24 * 60 * 60 * 1000);
  
  // Filter data from last 7 days
  const last7DaysData = haulerHistory.filter(point => 
    point.timestamp >= sevenDaysAgo
  );
  
  if (last7DaysData.length === 0) {
    console.log(`No data from last 7 days for ${getDisplayName(haulerId)} (${haulerId})`);
    return null;
  }
  
  console.log(`Found ${last7DaysData.length} data points from last 7 days for ${getDisplayName(haulerId)} (${haulerId})`);
  
  // Group data by date (YYYY-MM-DD format)
  const dataByDate = {};
  
  last7DaysData.forEach(point => {
    const date = new Date(point.timestamp);
    const dateKey = date.toISOString().split('T')[0]; // YYYY-MM-DD
    const dateLabel = date.toLocaleDateString('en-IN', { 
      weekday: 'short',
      month: 'short', 
      day: 'numeric' 
    }); // Format: Mon, Oct 21
    
    if (!dataByDate[dateKey]) {
      dataByDate[dateKey] = {
        dateKey: dateKey,
        dateLabel: dateLabel,
        totalDistance: 0,
        totalVibration: 0,
        totalSpeed: 0,
        totalPitch: 0,
        count: 0,
        points: []
      };
    }
    
    dataByDate[dateKey].points.push(point);
    dataByDate[dateKey].count++;
    
    // Add distance
    if (point.distance) {
      dataByDate[dateKey].totalDistance += point.distance;
    }
    
    // Add vibration
    if (point.vibration) {
      dataByDate[dateKey].totalVibration += point.vibration;
    }
    
    // Add speed
    if (point.speed) {
      dataByDate[dateKey].totalSpeed += point.speed;
    }
    
    // Add pitch (absolute value)
    if (point.pitch) {
      dataByDate[dateKey].totalPitch += Math.abs(point.pitch);
    }
  });
  
  // Calculate fuel cost for each date
  const results = [];
  
  for (const dateKey in dataByDate) {
    const dateData = dataByDate[dateKey];
    
    if (dateData.count === 0) continue;
    
    // Calculate averages
    const avgVibration = dateData.totalVibration / dateData.count;
    const avgSpeed = dateData.totalSpeed / dateData.count;
    const avgPitch = dateData.totalPitch / dateData.count;
    
    // Calculate fuel cost for this date
    const fuelResult = calculateFuelCostFromMetrics(
      haulerId,
      dateData.totalDistance,
      avgSpeed,
      avgVibration,
      avgPitch,
      dateData.count
    );
    
    results.push({
      dateKey: dateKey,
      dateLabel: dateData.dateLabel,
      dailyFuelCost: fuelResult.cost,
      totalDistance: dateData.totalDistance,
      avgSpeed: avgSpeed,
      avgVibration: avgVibration,
      avgPitch: avgPitch,
      fuelUsed: fuelResult.fuelUsed,
      calculationType: fuelResult.calculationType,
      factors: fuelResult.factors,
      calculationDetails: fuelResult.details,
      dataPoints: dateData.count
    });
  }
  
  // Sort by date (oldest to newest)
  results.sort((a, b) => a.dateKey.localeCompare(b.dateKey));
  
  console.log(`Generated ${results.length} days of data for ${getDisplayName(haulerId)} (${haulerId}):`, 
    results.map(r => `${r.dateLabel}: ₹${r.dailyFuelCost.toFixed(2)}`));
  
  return results;
}

// Helper function to calculate fuel cost for a single hauler
function calculateSingleHaulerFuelCost(haulerId) {
  const haulerHistory = pathHistory[haulerId];
  if (!haulerHistory || haulerHistory.length === 0) {
    console.log(`No history data for ${getDisplayName(haulerId)} (${haulerId})`);
    return null;
  }
  
  const displayName = getDisplayName(haulerId);
  console.log(`\n🔧 Processing ${haulerHistory.length} data points for ${displayName} (${haulerId})`);
  
  // Calculate totals from the last 24 hours
  const now = Date.now();
  const twentyFourHoursAgo = now - (24 * 60 * 60 * 1000);
  
  // Filter data from last 24 hours
  const last24HoursData = haulerHistory.filter(point => 
    point.timestamp >= twentyFourHoursAgo
  );
  
  if (last24HoursData.length === 0) {
    console.log(`No data from last 24 hours for ${displayName} (${haulerId})`);
    return {
      haulerId: haulerId,
      displayName: displayName,
      dailyFuelCost: 0,
      totalDistance: 0,
      avgSpeed: 0,
      avgVibration: 0,
      avgPitch: 0,
      fuelUsed: 0,
      dataPoints: 0,
      calculationDetails: []
    };
  }
  
  console.log(`Found ${last24HoursData.length} data points from last 24 hours`);
  
  // Calculate totals
  let totalDistance = 0;
  let totalVibration = 0;
  let totalSpeed = 0;
  let totalPitch = 0;
  let segmentCount = 0;
  
  for (let i = 0; i < last24HoursData.length; i++) {
    const point = last24HoursData[i];
    
    // Sum up distance between points
    if (point.distance) {
      totalDistance += point.distance;
    } else if (i > 0) {
      // Calculate distance if not stored
      const prevPoint = last24HoursData[i-1];
      const distance = haversineKm(prevPoint.pos, point.pos);
      totalDistance += distance;
      last24HoursData[i].distance = distance; // Store for future use
    }
    
    // Add vibration
    if (point.vibration) {
      totalVibration += point.vibration;
    }
    
    // Add speed
    if (point.speed) {
      totalSpeed += point.speed;
    }
    
    // Add pitch (absolute value for gradient)
    if (point.pitch) {
      totalPitch += Math.abs(point.pitch);
    }
    
    segmentCount++;
  }
  
  // Calculate averages
  const avgVibration = totalVibration / last24HoursData.length;
  const avgSpeed = totalSpeed / last24HoursData.length;
  const avgPitch = totalPitch / last24HoursData.length;
  
  console.log(`📈 Calculated metrics for ${displayName}:`);
  console.log(`  Total distance: ${totalDistance.toFixed(3)} km`);
  console.log(`  Average speed: ${avgSpeed.toFixed(1)} km/h`);
  console.log(`  Average vibration: ${avgVibration.toFixed(1)}`);
  console.log(`  Average pitch: ${avgPitch.toFixed(1)}°`);
  console.log(`  Data points: ${last24HoursData.length}`);
  
  // Calculate fuel cost with detailed breakdown
  const fuelResult = calculateFuelCostFromMetrics(
    haulerId,
    totalDistance,
    avgSpeed,
    avgVibration,
    avgPitch,
    last24HoursData.length
  );
  
  return {
    haulerId: haulerId,
    displayName: displayName,
    dailyFuelCost: fuelResult.cost,
    totalDistance: totalDistance,
    avgSpeed: avgSpeed,
    avgVibration: avgVibration,
    avgPitch: avgPitch,
    fuelUsed: fuelResult.fuelUsed,
    calculationType: fuelResult.calculationType,
    factors: fuelResult.factors,
    calculationDetails: fuelResult.details,
    dataPoints: last24HoursData.length
  };
}

// Function to calculate fuel cost from metrics with RUPEES
function calculateFuelCostFromMetrics(haulerId, distance, speed, vibration, pitch, dataPoints) {
  // Fuel prices in India
  const DIESEL_PRICE_PER_LITER = 94.50; // ₹ per liter
  
  // Get display name for logging
  const displayName = getDisplayName(haulerId);
  
  // Base fuel consumption rates (liters per 100km or liters per hour)
  let baseFuelRate;
  let calculationType;
  
  if (haulerId === 'D7') {
    // Excavator - consumption per hour
    baseFuelRate = 15; // liters per hour when operating
    calculationType = 'hourly';
  } else {
    // Haulers - consumption per 100km
    baseFuelRate = 30; // liters per 100km
    calculationType = 'distance';
  }
  
  console.log(`\n📊 Fuel Calculation for ${displayName} (${haulerId}) - ${calculationType}:`);
  console.log(`Base fuel rate: ${baseFuelRate} ${calculationType === 'hourly' ? 'L/hour' : 'L/100km'}`);
  console.log(`Distance traveled: ${distance.toFixed(2)} km`);
  console.log(`Average speed: ${speed.toFixed(1)} km/h`);
  console.log(`Average vibration: ${vibration.toFixed(1)}`);
  console.log(`Average pitch: ${pitch.toFixed(1)}°`);
  
  // Adjust for speed (optimal at 30-40 km/h for haulers)
  let speedFactor = 1.0;
  let speedNote = "Optimal speed (30-50 km/h)";
  
  if (speed) {
    if (speed < 20) {
      speedFactor = 1.3; // Inefficient at low speed
      speedNote = "Low speed (<20 km/h) - 30% penalty";
    } else if (speed > 50) {
      speedFactor = 1.2; // Inefficient at high speed
      speedNote = "High speed (>50 km/h) - 20% penalty";
    } else {
      speedFactor = 1.0; // Optimal range
    }
  }
  
  // Adjust for vibration (higher vibration = more fuel consumption)
  let vibrationFactor = 1.0;
  let vibrationNote = "Normal vibration";
  
  if (vibration) {
    vibrationFactor = 1 + (vibration - 1) * 0.15; // 15% increase per vibration level
    if (vibration >= 4) {
      vibrationNote = `High vibration (level ${vibration.toFixed(1)}) - ${((vibrationFactor-1)*100).toFixed(0)}% penalty`;
    }
  }
  
  // Adjust for gradient (pitch)
  let gradientFactor = 1.0;
  let gradientNote = "Flat terrain";
  
  if (pitch) {
    gradientFactor = 1 + (pitch / 15); // ~6.7% increase per degree of gradient
    if (pitch >= 5) {
      gradientNote = `Gradient terrain (${pitch.toFixed(1)}°) - ${((gradientFactor-1)*100).toFixed(0)}% penalty`;
    }
  }
  
  // Calculate fuel used
  let fuelUsed;
  let calculationDetails;
  
  if (haulerId === 'D7') {
    // For excavator: assume average operating time
    // Assuming 1 data point per minute on average
    const operatingHours = dataPoints / 60; // Convert minutes to hours
    fuelUsed = baseFuelRate * operatingHours * vibrationFactor * gradientFactor;
    
    calculationDetails = [
      `Base: ${baseFuelRate} L/hour × ${operatingHours.toFixed(2)} hours = ${(baseFuelRate * operatingHours).toFixed(2)} L`,
      `Speed factor: ${speedFactor.toFixed(2)} (${speedNote})`,
      `Vibration factor: ${vibrationFactor.toFixed(2)} (${vibrationNote})`,
      `Gradient factor: ${gradientFactor.toFixed(2)} (${gradientNote})`,
      `Total fuel: ${fuelUsed.toFixed(2)} L`
    ];
  } else {
    // For haulers: (L/100km) × (distance in km / 100)
    const baseFuel = (baseFuelRate * distance) / 100;
    fuelUsed = baseFuel * speedFactor * vibrationFactor * gradientFactor;
    
    calculationDetails = [
      `Base: (${baseFuelRate} L/100km × ${distance.toFixed(2)} km) / 100 = ${baseFuel.toFixed(2)} L`,
      `Speed factor: ${speedFactor.toFixed(2)} (${speedNote})`,
      `Vibration factor: ${vibrationFactor.toFixed(2)} (${vibrationNote})`,
      `Gradient factor: ${gradientFactor.toFixed(2)} (${gradientNote})`,
      `Total fuel: ${fuelUsed.toFixed(2)} L`
    ];
  }
  
  // Calculate cost in Rupees
  const fuelCost = fuelUsed * DIESEL_PRICE_PER_LITER;
  
  console.log(`Speed factor: ${speedFactor.toFixed(2)} (${speedNote})`);
  console.log(`Vibration factor: ${vibrationFactor.toFixed(2)} (${vibrationNote})`);
  console.log(`Gradient factor: ${gradientFactor.toFixed(2)} (${gradientNote})`);
  console.log(`Total fuel used: ${fuelUsed.toFixed(2)} L`);
  console.log(`Diesel price: ₹${DIESEL_PRICE_PER_LITER}/L`);
  console.log(`Total fuel cost: ₹${fuelCost.toFixed(2)}`);
  console.log('Calculation details:', calculationDetails);
  
  // Return both cost and details for tooltip
  return {
    cost: fuelCost,
    details: calculationDetails,
    fuelUsed: fuelUsed,
    baseFuelRate: baseFuelRate,
    calculationType: calculationType,
    factors: {
      speedFactor: speedFactor,
      vibrationFactor: vibrationFactor,
      gradientFactor: gradientFactor
    }
  };
}

    // Haversine formula to calculate distance between two coordinates in kilometers
    function haversineKm(coord1, coord2) {
      const toRad = x => x * Math.PI / 180;
      const R = 6371; // Earth's radius in km
      
      const dLat = toRad(coord2[0] - coord1[0]);
      const dLon = toRad(coord2[1] - coord1[1]);
      const lat1 = toRad(coord1[0]);
      const lat2 = toRad(coord2[0]);
      
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.sin(dLon/2) * Math.sin(dLon/2) * Math.cos(lat1) * Math.cos(lat2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      
      return R * c;
    }

// Helper function to group data points into 2-hour intervals
function groupByTwoHourIntervals(points) {
    const intervals = {};
    
    // Create 12 intervals (0-2, 2-4, 4-6, ..., 22-24)
    for (let hour = 0; hour < 24; hour += 2) {
        intervals[hour] = {
            points: [],
            totalDistance: 0,
            totalFuel: 0
        };
    }
    
    // Group points into intervals
    points.forEach(point => {
        const date = new Date(point.timestamp);
        const hour = date.getHours();
        
        // Find which 2-hour interval this hour belongs to
        const intervalStart = Math.floor(hour / 2) * 2;
        
        if (intervals[intervalStart]) {
            intervals[intervalStart].points.push(point);
            intervals[intervalStart].totalDistance += point.distance;
            intervals[intervalStart].totalFuel += point.fuel;
        }
    });
    
    return intervals;
}

    // Create 12 intervals (0-2, 2-4, 4-6, ..., 22-24)
    for (let hour = 0; hour < 24; hour += 2) {
        intervals[hour] = {
            points: [],
            totalDistance: 0,
            totalFuel: 0
        };
    }
    
    // Group points into intervals
    points.forEach(point => {
        const date = new Date(point.timestamp);
        const hour = date.getHours();
        
        // Find which 2-hour interval this hour belongs to
        const intervalStart = Math.floor(hour / 2) * 2;
        
        if (intervals[intervalStart]) {
            intervals[intervalStart].points.push(point);
            intervals[intervalStart].totalDistance += point.distance;
            intervals[intervalStart].totalFuel += point.fuel;
        }
    });
    
    return intervals;
}

// Helper function to calculate gradient breakdown from path history
function calculateGradientBreakdownFromPathHistory(deviceId, totalGradient) {
  let gradient5to30 = 0;
  let gradient30to50 = 0;
  let gradientAbove50 = 0;
  
  if (pathHistory[deviceId] && pathHistory[deviceId].length > 1) {
    // Count actual pitch values from path history
    for (let i = 1; i < pathHistory[deviceId].length; i++) {
      const pitch = Math.abs(pathHistory[deviceId][i].pitch || 0);
      if (pitch > 5 && pitch <= 30) {
        gradient5to30++;
      } else if (pitch > 30 && pitch <= 50) {
        gradient30to50++;
      } else if (pitch > 50) {
        gradientAbove50++;
      }
    }
    
    console.log(`📊 Calculated gradient breakdown from path history for ${getDisplayName(deviceId)}:`, {
      gradient5to30,
      gradient30to50,
      gradientAbove50
    });
  } else {
    // Fallback: Use estimated distribution if no path history
    gradient5to30 = Math.floor(totalGradient * 0.7);   // 70% mild
    gradient30to50 = Math.floor(totalGradient * 0.25); // 25% moderate
    gradientAbove50 = totalGradient - gradient5to30 - gradient30to50; // 5% steep
    
    if (gradientAbove50 < 0) gradientAbove50 = 0;
    
    console.log(`📊 Estimated gradient breakdown for ${getDisplayName(deviceId)}:`, {
      gradient5to30,
      gradient30to50,
      gradientAbove50
    });
  }
  
  return { gradient5to30, gradient30to50, gradientAbove50 };
}

    async function processNewData(newData) {
      if (!newData || !newData.sites) return;
      
      const now = Date.now();
      let dataChanged = false;
      let haulersWithNewData = new Set();
      
      for (const haulerId in newData.sites) {
        const site = newData.sites[haulerId];
        if (site.pos && Array.isArray(site.pos)) {
          if (!pathHistory[haulerId]) {
            pathHistory[haulerId] = [];
          }
          
          const lastPoint = pathHistory[haulerId][pathHistory[haulerId].length - 1];
          const shouldAddPoint = !lastPoint || haversineKm(lastPoint.pos, site.pos) > 0.0005;
          
          if (shouldAddPoint) {
            dataChanged = true;
            haulersWithNewData.add(haulerId);
            const C = 525.5;
            const altitude = site.altitude || 0;
            const rl = altitude + C;
            
            pathHistory[haulerId].push({
              pos: site.pos,
              timestamp: now,
              rl: Number(rl.toFixed(2)),
              altitude: altitude,
              pitch: site.pitch || 0,
              roll: site.roll || 0,
              vibration: site.vibration || 0,
              movement: Number(site.movement ?? 0),
              payload: site.load || 0,
              speed: site.speed || 0
            });
          }
          
          if (sites[haulerId]) {
            sites[haulerId].pos = site.pos;
            sites[haulerId].rl = getRL(site.altitude);
            sites[haulerId].altitude = site.altitude || 0;
            sites[haulerId].pitch = site.pitch || 0;
            sites[haulerId].roll = site.roll || 0;
            sites[haulerId].vibration = site.vibration || 0;
            sites[haulerId].movement = site.movement || 0;
            sites[haulerId].load = site.load || 0;
            sites[haulerId].speed = site.speed || 0;
          } else {
            const rl = getRL(site.altitude);
            sites[haulerId] = {
              id: haulerId,

  function makeLineChart(title, labels, values, color = '#4D96FF', valueText = null) {
    const div = document.createElement('div');
    div.className = 'card';

    const valueNum = parseFloat(valueText);
    const { statusColor, statusSymbol, statusLabel } = getStatus(valueNum);

    let html = `<h3 style="font-size: 18px; font-weight: bold;">${title}</h3>`;

    if (valueText !== null) {
      html += `
        <div class="flex items-center space-x-2 mb-2 text-base font-semibold text-white">
          <div class="metric">${valueText}</div>
          <div class="flex items-center space-x-1">
            <span style="color:${statusColor};">${statusSymbol}</span>
            <span>${statusLabel}</span>
          </div>
        </div>
      `;
    }
    html += `<canvas></canvas>`;
    div.innerHTML = html;
    const formattedLabels = labels.map(label => {
      const date = new Date(label);
      if (isNaN(date)) return label;
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}`;
    });
    const ctx = div.querySelector('canvas').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: formattedLabels,
        datasets: [{
          label: title,
          data: values,
          borderColor: color,
          backgroundColor: `${color}20`,
          tension: 0.3,
          fill: true,
          borderWidth: 2,
          pointRadius: 1
        }]
      },
      options: {
        plugins: {
          legend: { display: false },
          tooltip: {
            bodyFont: { size: 40, weight: 'bold' },
            titleFont: { size: 40, weight: 'bold' }
          }
        },
        scales: {
          x: { display: true, ticks: { color: '#ccc' }, grid: { display: false } },
          y: { display: true, grid: { display: false } }
        }
      }
    });

    return div;
  }

    existingCharts.forEach(chart => chart.remove());

    for (const hauler of haulers) {
      // Skip if a specific hauler is selected and this isn't it
      if (selectedHaulerForChart !== 'all' && hauler !== selectedHaulerForChart) {
        continue;
      }

      const data = haulerData[hauler];
      if (!data || !Array.isArray(data) || data.length === 0) continue;

      data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      const limitedData = data.slice(0, 5);

      let zAxis = limitedData.map(row => Number(row.z_axis));
      let timestamps = limitedData.map(row => row.timestamp);

      if (zAxis.length === 0) {
        zAxis = [-30, -25, -20, -15, -10];
        timestamps = new Array(5).fill(new Date().toISOString());
      }

      const gradients = zAxis.map(z => Math.sin(z * Math.PI / 180) * 100);
      const fuelConsumption = zAxis.map(z => FC0 * (1 + 0.1 * Math.sin(z * Math.PI / 180)));

      const avgFuel = fuelConsumption.reduce((a, b) => a + b, 0) / fuelConsumption.length;
      const avgGrad = gradients.reduce((a, b) => a + b, 0) / gradients.length;

      const chartElement = makeFuelGradientChart(
        `${hauler} Fuel & Gradient Overview`,
        [
          { name: 'Fuel Consumption', values: fuelConsumption, color: '#36a2eb' },
          { name: 'Gradient', values: gradients, color: '#32cd32' },
          { name: `Average Fuel (${avgFuel.toFixed(2)} L/100km)`,
            values: new Array(zAxis.length).fill(avgFuel), color: 'orange' },
          { name: `Average Gradient (${avgGrad.toFixed(2)}%)`,
            values: new Array(zAxis.length).fill(avgGrad), color: 'green' }
        ],
        `Avg Fuel: ${avgFuel.toFixed(2)} L/100km`,
        timestamps
      );

      // Add a class to identify fuel gradient charts
      chartElement.classList.add('fuel-gradient-chart');
      grid.appendChild(chartElement);
    }

  } catch (err) {
    console.error('Error fetching z_axis values:', err);
  }
}

function startRealTimeUpdates(grid) {
  appendFuelGradientChart(grid);
  setInterval(() => appendFuelGradientChart(grid), 5000);
}

function makeFuelGradientChart(title, datasets, valueText = null, labels) {
  const div = document.createElement('div');
  div.className = 'card2';

  const valueNum = parseFloat(valueText.split(' ')[2]);
  const { statusColor, statusSymbol, statusLabel } = getStatus(valueNum);

  let html = `<h3 style="font-size:18px;font-weight:bold;">${title}</h3>`;
  if (valueText !== null) {
    html += `
      <div class="flex items-center space-x-2 mb-2 text-base font-semibold text-white">
        <div class="metric">${valueText}</div>
        <div class="flex items-center space-x-1">
          <span style="color:${statusColor};">${statusSymbol}</span>
          <span>${statusLabel}</span>
        </div>
      </div>`;
  }
  html += `<canvas style="height:200px"></canvas>`;
  div.innerHTML = html;

  // Use exact timestamps from backend, preserving original format
  const formattedLabels = labels.map(l => {
    const d = new Date(l);
    if (isNaN(d)) return l; // Use original string if invalid date
    return l; // Preserve exact backend timestamp
   
  });

  const ctx = div.querySelector('canvas').getContext('2d');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: formattedLabels,
      datasets: datasets.map(ds => {
        const isGradient = ds.name.toLowerCase().includes('gradient');
        const isAverageFuel = ds.name.toLowerCase().includes('average fuel');
        return {
          label: ds.name,
          data: ds.values,
          borderColor: ds.color || '#4D96FF',
          backgroundColor: `${(ds.color || '#4D96FF')}20`,
          tension: 0.3,
          fill: !(isGradient || isAverageFuel),
          borderWidth: 2,
          pointRadius: isGradient ? 4 : 2,
          yAxisID: isGradient ? 'y1' : 'y'
        };
      })
    },
    options: {
  responsive: true,
  maintainAspectRatio: false,
  layout: {
    padding: { top: 10, bottom: 0, left: 0, right: 0 } // tighter padding
  },
  plugins: {
    legend: { display: false },
    tooltip: {
      mode: 'index',
      intersect: false,
      bodyFont: { size: 12 },
      titleFont: { size: 12 }
    }
  },
      elements: {
    line: {
      borderWidth: 1.5,       // thinner lines
      tension: 0.25           // smoother curve but not too round
    },
    point: {
      radius: 2,              // smaller dots
      hoverRadius: 4
    }
  },
      scales: {
        x: {
          ticks: { color: '#ccc', maxRotation: 0 },
          grid: { display: false }
        },
        y: {
          title: { display: true, text: 'Fuel (L/100km)', color: '#ccc' },
          ticks: { color: '#ccc' , maxTicksLimit:8},
          grid: { color: '#333' }
        },
        y1: {
          position: 'right',
          title: { display: true, text: 'Gradient (%)', color: '#ccc' },
          ticks: { color: 'green',maxTicksLimit: 8 },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });

  return div;
}


  function getStatus(value) {
    if (isNaN(value)) {
      return { statusColor: 'gray', statusSymbol: '•', statusLabel: 'Unknown' };
    }
    if (value < 25) {
      return { statusColor: 'green', statusSymbol: '↓', statusLabel: 'Low' };
    } else if (value <= 35) {
      return { statusColor: 'orange', statusSymbol: '→', statusLabel: 'Normal' };
    } else {
      return { statusColor: 'red', statusSymbol: '↑', statusLabel: 'High' };
    }
  }
